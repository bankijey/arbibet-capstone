[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbibet-capstone"
version = "0.0.0"
description = "Ironhack DE capstone — reads the Arbibet markets bronze layer."
requires-python = ">=3.12"

dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "pandas==2.2.3",
    "numpy==2.1.2",
    "confluent-kafka>=2.5,<3",
    "snowflake-connector-python>=3.12,<4",
    "openai>=1.0",
]

[project.optional-dependencies]
# pyspark is an extra rather than a hard dependency: only the jobs under
# `spark/` need it, and it is a 400 MB download nothing else uses. But it IS
# declared, because CI type-checks those jobs and an undeclared import would
# either fail on a clean install or be silenced with ignore_missing_imports --
# which would make CI check a different program than the one that runs here.
spark = ["pyspark>=4.0,<5"]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
    "mypy==1.11.2",
    # `docs/capture_screenshots.py` only. It drives the Chrome already on the
    # machine (`channel="chrome"`), so `playwright install` is NOT needed and
    # no browser is downloaded.
    #
    # Pinned to the version the committed screenshots were actually captured
    # with. It was pinned at 1.48.0 while the venv had been given 1.62.0 by an
    # unpinned `pip install`, so a fresh clone would have installed a
    # playwright nobody had run this script against.
    "playwright==1.62.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Same reasoning as the mypy override below: vendored, not authored here.
extend-exclude = ["src/arbibet_capstone/crosswalk"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
# Every directory this repo authors. CI runs a bare `mypy`, so the config has
# to be the definition of what is checked -- a longer command line in a
# workflow file is a second definition that drifts from what runs locally.
files = ["src", "tests", "consumers", "producer", "snowflake", "spark", "slips"]
explicit_package_bases = true
mypy_path = "src"

# The vendored engine (parsers + arbitrage) is ported code, not code this repo
# authored. It is excluded from the strict budget rather than annotated: typing
# it would mean rewriting it, and a rewrite is exactly what porting avoids.
# Everything this repo *does* author stays under strict.
[[tool.mypy.overrides]]
module = "arbibet_capstone.crosswalk.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
